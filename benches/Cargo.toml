[package]
name = "takia_benchmarks"
version = "0.1.0"
authors = [
    "Alice Cecile <alice.i.cecile@gmail.com>",
    "Johnathan Kelley <jkelleyrtp@gmail.com>",
]
edition = "2021"
description = "Benchmarks for the takia crate"
repository = "https://github.com/DioxusLabs/takia"
keywords = ["cross-platform", "layout", "benchmarks"]
categories = ["gui", "benchmarks"]
license = "MIT"

rust-version = "1.95"

[dependencies]
criterion = "0.8.2"
rand = { version = "0.10.3" }
rand_chacha = "0.10.0"
takia = { path = ".." }
takia_03 = { package = "taffy", version = "0.3", optional = true }
yoga = { version = "0.4.1", optional = true }
ordered-float = { version = "5.5.1", optional = true }
slotmap = { version = "1.1.1", optional = true }
morphorm = { version = "0.9.0", optional = true }
torin = { version = "=0.5.0-rc.13", optional = true }
cephal = { version = "0.2.0", optional = true }
parley = "0.12.0"

[features]
yoga = ["dep:yoga", "dep:slotmap", "dep:ordered-float"]
yoga-super-deep = ["yoga"]
takia03 = ["dep:takia_03"]
morphorm = ["dep:morphorm"]
torin = ["dep:torin"]
cephal = ["dep:cephal"]
content_size = ["takia/content_size"]
strict_provenance = ["takia/strict_provenance"]
small = []
large = []
grid-alternating-spans = []

# The library only contains helpers for the benchmarks. Disabling the default `libtest` bench harness for it
# allows Criterion's CLI options to be passed straight through (e.g. `cargo bench -- --save-baseline main`).
[lib]
bench = false

[[bench]]
name = "tree_creation"
path = "benches/tree_creation.rs"
harness = false

[[bench]]
name = "flexbox"
path = "benches/flexbox.rs"
harness = false

[[bench]]
name = "grid"
path = "benches/grid.rs"
harness = false

[[bench]]
name = "mixed"
path = "benches/mixed.rs"
harness = false

[[bench]]
name = "relayout"
path = "benches/relayout.rs"
harness = false

[[bench]]
name = "pangui"
path = "benches/pangui.rs"
harness = false

[workspace]
resolver = "3"
